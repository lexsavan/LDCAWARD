<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຜົນໂຫວດຂວັນໃຈ - Live</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9922A;
    --gold-light: #F0C96B;
    --gold-pale: #FDF4DC;
    --gold-dark: #8B5E0A;
    --bg: #0F0A02;
    --surface: #1C1306;
    --surface2: #251A08;
    --border: #3A2A0A;
    --text: #F5E6C0;
    --muted: #8B7A50;
    --green: #4CAF50;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Lao', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1A1208, #3D2A04, #1A1208);
    padding: 1.5rem 1.5rem 1.25rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--gold-light); margin-bottom: 4px; }
  .header-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .live-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--green);
  }
  .live-dot::before {
    content: '';
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  .last-update { font-size: 11px; color: var(--muted); }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-box {
    background: var(--surface);
    padding: 1rem;
    text-align: center;
  }
  .stat-box .val { font-size: 28px; font-weight: 700; color: var(--gold-light); line-height: 1; }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* CONTAINER */
  .container { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem; }

  /* PODIUM */
  .podium-title {
    font-size: 13px; color: var(--muted); letter-spacing: .06em;
    margin-bottom: .75rem; display: flex; align-items: center; gap: 8px;
  }
  .podium-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; align-items: end; }
  .podium-item {
    border-radius: var(--radius-sm);
    padding: .75rem .5rem;
    text-align: center;
    position: relative;
    border: 1px solid var(--border);
  }
  .podium-item.rank-1 { background: linear-gradient(180deg, #2A1F02, #1A1208); border-color: var(--gold); order: 2; }
  .podium-item.rank-2 { background: var(--surface2); order: 1; }
  .podium-item.rank-3 { background: var(--surface2); order: 3; }
  .podium-medal { font-size: 22px; display: block; margin-bottom: 4px; }
  .podium-num { font-size: 22px; font-weight: 700; color: var(--gold-light); }
  .podium-item.rank-1 .podium-num { font-size: 28px; }
  .podium-votes { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .podium-item.rank-1 .podium-votes { color: var(--gold); font-size: 13px; }

  /* LIST */
  .list-title {
    font-size: 13px; color: var(--muted); letter-spacing: .06em;
    margin-bottom: .75rem; display: flex; align-items: center; gap: 8px;
  }
  .list-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .vote-list { display: flex; flex-direction: column; gap: 8px; }
  .vote-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color .3s;
  }
  .vote-item.top1 { border-color: var(--gold); background: linear-gradient(90deg, #2A1F02, var(--surface)); }
  .vote-item.top2 { border-color: #8A8A8A; }
  .vote-item.top3 { border-color: #8B6914; }
  .rank-badge {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
    background: var(--surface2); color: var(--muted);
  }
  .vote-item.top1 .rank-badge { background: var(--gold); color: #fff; }
  .vote-item.top2 .rank-badge { background: #6B6B6B; color: #fff; }
  .vote-item.top3 .rank-badge { background: #7A5C10; color: #fff; }
  .item-num { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; }
  .item-count { font-size: 13px; color: var(--muted); margin-right: 8px; white-space: nowrap; }
  .bar-wrap { flex: 2; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
    transition: width .6s ease;
  }
  .vote-item.top1 .bar-fill { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }

  /* EMPTY */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty .icon { font-size: 40px; display: block; margin-bottom: 12px; }

  /* REFRESH BTN */
  .refresh-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 1.5rem auto 0;
    padding: 10px 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Sans Lao', sans-serif;
    transition: all .15s;
  }
  .refresh-btn:hover { border-color: var(--gold); color: var(--gold-light); }
  .refresh-btn.spinning .icon-r { animation: spin .7s linear infinite; display:inline-block; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ZERO items */
  .zero { opacity: .35; }
</style>
</head>
<body>

<div class="header">
  <h1>👑 ຜົນໂຫວດຂວັນໃຈ</h1>
  <div class="header-row" style="margin-top:6px">
    <span class="live-dot">LIVE</span>
    <span class="last-update" id="last-update">ກຳລັງໂຫຼດ...</span>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-box">
    <div class="val" id="stat-total">-</div>
    <div class="lbl">ສຽງທັງໝົດ</div>
  </div>
  <div class="stat-box">
    <div class="val" id="stat-nums">-</div>
    <div class="lbl">ໝາຍເລກທີ່ໄດ້ສຽງ</div>
  </div>
  <div class="stat-box">
    <div class="val" id="stat-lead">-</div>
    <div class="lbl">ໜ້ານຳ No.</div>
  </div>
</div>

<div class="container">
  <div class="podium-title">🏆 TOP 3</div>
  <div class="podium" id="podium"></div>

  <div class="list-title">📊 ຜົນລວມທັງໝົດ</div>
  <div class="vote-list" id="vote-list">
    <div class="empty"><span class="icon">⏳</span>ກຳລັງໂຫຼດຂໍ້ມູນ...</div>
  </div>

  <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
    <span class="icon-r">🔄</span> ໂຫຼດໃໝ່
  </button>
</div>

<script>
  const SUPABASE_URL = 'https://ywrrttsyhqvtfbnzkqqp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3cnJ0dHN5aHF2dGZibnprcXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDQ5NzQsImV4cCI6MjA5NDc4MDk3NH0.ePOwhkVXeXBqONJOh5bjgQII0TQxjh3O3E0SVQUkQIY';
  const TOTAL = 20;

  async function fetchVotes() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/votes?select=number`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    return await res.json();
  }

  function buildResults(rows) {
    // Count votes per number
    const counts = {};
    for (let i = 1; i <= TOTAL; i++) counts[i] = 0;
    rows.forEach(r => { if (counts[r.number] !== undefined) counts[r.number]++; });

    // Sort by votes desc
    const sorted = Object.entries(counts)
      .map(([num, votes]) => ({ num: parseInt(num), votes }))
      .sort((a, b) => b.votes - a.votes || a.num - b.num);

    return sorted;
  }

  function renderPodium(sorted) {
    const podium = document.getElementById('podium');
    const top3 = sorted.slice(0, 3);
    if (top3.every(t => t.votes === 0)) {
      podium.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:1rem;">ຍັງບໍ່ມີຜົນໂຫວດ</div>';
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    const classes = ['rank-1','rank-2','rank-3'];
    podium.innerHTML = top3.map((item, i) => `
      <div class="podium-item ${classes[i]}">
        <span class="podium-medal">${medals[i]}</span>
        <div class="podium-num">No.${item.num}</div>
        <div class="podium-votes">${item.votes} ສຽງ</div>
      </div>
    `).join('');
  }

  function renderList(sorted, total) {
    const list = document.getElementById('vote-list');
    const max = sorted[0]?.votes || 1;

    if (total === 0) {
      list.innerHTML = '<div class="empty"><span class="icon">🗳️</span>ຍັງບໍ່ມີການໂຫວດ</div>';
      return;
    }

    const rankClass = (i) => i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const rankLabel = (i) => i < 3 ? (i + 1) : '';

    list.innerHTML = sorted.map((item, i) => {
      const pct = max > 0 ? (item.votes / max * 100) : 0;
      const isZero = item.votes === 0;
      return `
        <div class="vote-item ${rankClass(i)} ${isZero ? 'zero' : ''}">
          <div class="rank-badge">${rankLabel(i) || (i+1)}</div>
          <div class="item-num">No.${item.num}</div>
          <div class="bar-wrap">
            <div class="bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="item-count">${item.votes} ສຽງ</div>
        </div>
      `;
    }).join('');
  }

  function renderStats(sorted, total) {
    const withVotes = sorted.filter(s => s.votes > 0).length;
    const leader = sorted[0];
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-nums').textContent = withVotes;
    document.getElementById('stat-lead').textContent = leader && leader.votes > 0 ? leader.num : '-';
  }

  async function loadData() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');

    try {
      const rows = await fetchVotes();
      const sorted = buildResults(rows);
      const total = rows.length;

      renderStats(sorted, total);
      renderPodium(sorted);
      renderList(sorted, total);

      const now = new Date().toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('last-update').textContent = `ອັບເດດລ່າສຸດ: ${now}`;
    } catch (e) {
      document.getElementById('vote-list').innerHTML = '<div class="empty"><span class="icon">❌</span>ບໍ່ສາມາດໂຫຼດຂໍ້ມູນ ກະລຸນາລອງໃໝ່</div>';
    }

    btn.classList.remove('spinning');
  }

  // Auto refresh every 15 seconds
  loadData();
  setInterval(loadData, 15000);
</script>
</body>
</html>
